<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Animated Solar System</title>
  <link rel="stylesheet" href="solar system.css">
</head>
<body>
  <h1 class="system-title">Solar System</h1>
  <div class="container">
    <!-- Sun -->
    <div class="sun">
      <img src="https://ts3.mm.bing.net/th?id=OIP.xRGYhhP6KtHvYWlRVcvWhwHaHk&pid=15.1&o=7&rm=3" alt="Sun">
    </div>

    <!-- Mercury -->
    <div class="orbit mercury-orbit">
      <div class="planet mercury">
        <img src="https://ts4.mm.bing.net/th?id=OIP.tENrwupXBs_gZUM0tWhovQHaHZ&pid=15.1&o=7&rm=3" alt="Mercury">
      </div>
    </div>

    <!-- Venus -->
    <div class="orbit venus-orbit">
      <div class="planet venus">
        <img src="https://ts4.mm.bing.net/th?id=OIP.8c8pXv3R60WnR7vxzcQSqQHaHa&pid=15.1&o=7&rm=3" alt="Venus">
      </div>
    </div>




<div class="orbit earth-orbit">
  <div class="planet earth">
    <img src="https://ts2.mm.bing.net/th?id=OIP.q6W9u2pZhf_fSnPRcptgmgHaHa&pid=15.1&o=7&rm=3" alt="Earth">

    <!-- Moon orbiting Earth -->
    <div class="orbit moon-orbit">
      <div class="moon">
        <img src="https://copilot.microsoft.com/th/id/BCO.3d2cbc10-9e01-41c7-8567-285f48432062.png" alt="Moon">
      </div>
    </div>
  </div>
</div>


    <!-- Mars -->
    <div class="orbit mars-orbit">
      <div class="planet mars">
        <img src="https://ts3.explicit.bing.net/th?id=OIP.5dmCj-wiJKGd79_FtOc1_gHaHa&pid=15.1&o=7&rm=3" alt="Mars">
      </div>
    </div>

    <!-- Jupiter -->
    <div class="orbit jupiter-orbit">
      <div class="planet jupiter">
        <img src="https://ts2.mm.bing.net/th?id=OIP.5GIDwm_CQCxfLY51YYUcCgHaHa&pid=15.1&o=7&rm=3" alt="Jupiter">
      </div>
    </div>

    <!-- Saturn -->
    <div class="orbit saturn-orbit">
      <div class="planet saturn">
        <img src="https://ts1.explicit.bing.net/th?id=OIP._0SfNZRcWz_nd8Y7njHqMgHaHa&pid=15.1&o=7&rm=3" alt="Saturn">
      </div>
    </div>

    <!-- Uranus -->
    <div class="orbit uranus-orbit">
      <div class="planet uranus">
        <img src="https://ts2.mm.bing.net/th?id=OIP.em_HvKLXTl3anzcLi8dhaAHaHO&pid=15.1&o=7&rm=3" alt="Uranus">
      </div>
    </div>

    <!-- Neptune -->
    <div class="orbit neptune-orbit">
      <div class="planet neptune">
        <img src="https://ts3.mm.bing.net/th?id=OIP.Td2ahp_FHNxBksMvQXuYxAHaHa&pid=15.1&o=7&rm=3" alt="Neptune">
      </div>
    </div>
  </div>
</body>
</html>
